<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Pipeline Dashboard</title>
<style>
:root{--won:#76b7b2;--hot:#f28e2b;--pot:#e15759;--fc:#4e79a7;--ink:#333;--muted:#6f7b8a;--grid:#e3e6ea;--sel:#dde6f0;--line:#d9dce0}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);padding:16px}
.wrap{max-width:1040px;margin:0 auto}
a{color:#2a5b8c}
.topbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px;font-size:14px}
.topbar h2{margin:0;font-size:18px;font-weight:600;margin-right:auto}
.topbar select,.topbar input,.topbar button,.btn{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #b9c0c8;background:#fff;border-radius:4px}
.btn{cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:#2a5b8c;border-color:#2a5b8c;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #4e79a7;outline-offset:1px}
.meta{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.notice{padding:10px 12px;border:1px solid var(--line);background:#fff;font-size:13.5px;margin-bottom:12px}
.notice.err{border-color:#e15759;background:#fdf1f1;color:#8a2a2c}
.notice.warn{border-color:#f28e2b;background:#fff6ec}
.notice.ok{border-color:#76b7b2;background:#effaf9}

.tabs{display:flex;gap:2px;margin-bottom:-1px;position:relative;z-index:1}
.tabs button{font:inherit;font-size:13px;padding:7px 16px;border:1px solid var(--line);border-bottom:0;background:#e8eaed;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600}
.tabs button:focus-visible{outline:2px solid #4e79a7}
.dash{display:flex;gap:14px;background:#fff;padding:12px;border:1px solid var(--line);position:relative}
.dash[hidden]{display:none}
.chart{flex:1;min-width:0;border:1px solid #cfd3d8;padding:6px 8px 8px}
.chart h1{font-size:24px;font-weight:600;margin:4px 0 10px;letter-spacing:.2px}
.chart h1 .unit{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:normal;margin-left:8px}
.head{display:grid;grid-template-columns:150px 1fr;font-size:14px;font-weight:600;border-bottom:1px solid var(--grid);padding-bottom:4px}
.head span:last-child{text-align:center;padding-right:8px}
.row{display:grid;grid-template-columns:110px 26px 1fr;height:96px;border-bottom:1px solid var(--grid)}
.who{font-size:13px;color:var(--muted);align-self:center;line-height:1.35;word-break:break-word;padding-right:6px}
.yl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:600;text-align:center;align-self:center}
.plot{position:relative;margin:10px 0 9px 34px}
.tick{position:absolute;left:-34px;width:28px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(50%)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
.col{position:relative;transition:opacity .2s}
.bar{position:absolute;left:14%;right:14%;bottom:0;transition:height .35s;cursor:pointer;min-height:2px}
.val{position:absolute;left:-10%;right:-10%;text-align:center;font-size:12.5px;white-space:nowrap;pointer-events:none}
.foot{display:grid;grid-template-columns:136px 1fr;font-size:13px;color:var(--muted);padding-top:6px}
.foot div{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-left:34px}
.empty{padding:60px 10px;text-align:center;color:var(--muted);font-size:14px}
.empty.err{color:#8a2a2c}
#loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}
#loading::after{content:"";display:inline-block;width:18px;height:18px;margin-left:8px;border:2px solid var(--grid);border-top-color:#4e79a7;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.head2{grid-template-columns:190px 1fr}
.r2{display:grid;grid-template-columns:190px repeat(4,1fr);height:24px;border-bottom:1px solid var(--grid);align-items:end}
.r2 .who{align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;line-height:1;word-break:normal}
.cell{position:relative;height:100%}
.cell .h{position:absolute;left:12%;right:12%;bottom:2px;cursor:pointer}
.cell .t{position:absolute;left:0;right:0;top:0;text-align:center;font-size:11.5px;line-height:13px;white-space:nowrap;pointer-events:none}
.foot2{display:grid;grid-template-columns:190px repeat(4,1fr);font-size:13px;color:var(--muted);padding-top:6px;text-align:center}
.foot2 .cats{grid-column:2/-1;display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
aside{width:190px;flex:none;font-size:13px}
aside h3{font-size:13px;font-weight:600;margin:0 0 6px}
.sec{margin-bottom:20px}
.list{max-height:560px;overflow:auto}
.list.short{max-height:none}
label.o{display:flex;align-items:center;gap:6px;padding:2px 3px;cursor:pointer;color:var(--muted);white-space:nowrap;overflow:hidden}
label.o.on{background:var(--sel)}
label.o span{overflow:hidden;text-overflow:ellipsis}
input[type=checkbox]{margin:0;accent-color:#4e79a7;flex:none}
.rng{position:relative;height:22px;margin-top:4px}
.rng input{position:absolute;left:0;width:100%;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;margin:0;height:22px;padding:0;border:0}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:11px;height:11px;border-radius:50%;background:#fff;border:1.5px solid #555;cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #555;cursor:pointer}
.track{position:absolute;left:0;right:0;top:10px;height:2px;background:#bbb}
.fill{position:absolute;top:10px;height:2px;background:#4e79a7}
.rv{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:6px;padding:2px 3px;cursor:pointer;color:var(--muted);border:0;background:none;width:100%;font:inherit;text-align:left}
.lg i{width:11px;height:11px;display:inline-block}
.lg.sel{background:var(--sel);color:var(--ink)}
.lg:focus-visible,label.o:focus-within{outline:2px solid #4e79a7}
.grad{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.grad i{flex:1;height:18px;background:linear-gradient(90deg,#d3e5f4,#2a5b8c)}
.pin{position:absolute;z-index:8;min-width:210px;max-width:290px;background:#fff;border:1px solid #2a5b8c;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:8px 28px 8px 10px;font-size:12px;line-height:1.55;border-radius:3px}
.pin .x{position:absolute;top:2px;right:4px;border:0;background:none;font-size:18px;line-height:1;cursor:pointer;color:var(--muted)}
.pin .pt{font-weight:600;font-size:13px;word-break:break-word}
.pin .pc{color:var(--muted);margin-bottom:4px}
.pin .pr{display:flex;justify-content:space-between;gap:14px}
.bar.sel{outline:2px solid #1f2d3d;outline-offset:1px}
.cell.sel{background:rgba(78,121,167,.14)}
.cell .h.sel{outline:2px solid #1f2d3d;outline-offset:1px}
#tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #bbb;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:6px 9px;font-size:12px;display:none;z-index:9;line-height:1.5}
.pres{background:#fff;border:1px solid var(--line);padding:24px}
.pres h1{margin:0 0 2px;font-size:26px}
.pres .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.pres .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.pres .kpi div{border:1px solid var(--line);padding:14px 8px;text-align:center;border-top:3px solid var(--fc)}
.pres .kpi .n{font-size:20px;font-weight:700}
.pres .kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.pres h3{font-size:14px;margin:22px 0 8px}
.barrow{display:grid;grid-template-columns:170px 1fr 110px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.barrow .bar{height:14px;background:#4e79a7;min-width:2px}
.barrow .bwrap{background:#eef1f4}
.barrow .v{text-align:right;color:var(--muted)}
@media print{.topbar,.notice{display:none!important}}
@media(max-width:760px){.pres .kpi{grid-template-columns:repeat(2,1fr)}.barrow{grid-template-columns:110px 1fr 90px}.dash{flex-direction:column}aside{width:100%}.row{grid-template-columns:80px 22px 1fr}.head,.foot{grid-template-columns:110px 1fr}.val{font-size:10px}
.r2,.foot2{grid-template-columns:110px repeat(4,1fr)}.head2{grid-template-columns:110px 1fr}.cell .t{font-size:9px}}

#detailOv .panel{max-width:1100px;margin:0 auto;background:#fff;border:1px solid var(--line);padding:12px}
.dh{display:grid;grid-template-columns:190px 1fr;font-size:14px;font-weight:600;border-bottom:1px solid var(--grid);padding-bottom:4px}
.dh span:last-child{text-align:center}
.dr{display:grid;height:96px;border-bottom:1px solid var(--grid)}
.dr .who{font-size:12.5px}
.dc{position:relative}
.dc .db{position:absolute;left:14%;right:14%;bottom:0;min-height:2px}
.dc .dl{position:absolute;left:50%;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;font-size:11px;white-space:nowrap;pointer-events:none}
.dfoot{display:grid;grid-template-columns:190px 1fr;padding-top:6px}
.dcats{display:grid;text-align:center;font-size:12px;color:var(--muted)}
#detailOv .panel{max-width:1240px}
#detailOv aside{width:240px}
.dr{height:108px}
.dc{margin:10px 0 4px;background:linear-gradient(#e3e6ea,#e3e6ea) 0 0/100% 1px no-repeat,linear-gradient(#e3e6ea,#e3e6ea) 0 50%/100% 1px no-repeat,linear-gradient(#cfd3d8,#cfd3d8) 0 100%/100% 1px no-repeat}
.dr .yl{font-size:11px}
.dt{position:relative;margin:10px 0 4px}
.dt span{position:absolute;right:4px;font-size:11px;color:var(--muted);white-space:nowrap}
.dfoot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:12px;color:var(--muted);padding:0 2px}
.dc{background:linear-gradient(#e3e6ea,#e3e6ea) 0 0/100% 1px no-repeat,linear-gradient(#e3e6ea,#e3e6ea) 0 33.33%/100% 1px no-repeat,linear-gradient(#e3e6ea,#e3e6ea) 0 66.67%/100% 1px no-repeat,linear-gradient(#cfd3d8,#cfd3d8) 0 100%/100% 1px no-repeat}
.dc .dl{writing-mode:horizontal-tb;transform:translateX(-50%);font-size:11px;line-height:13px}
.dtip{position:fixed;z-index:50;background:#fff;border:1px solid #bbb;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:8px 12px;pointer-events:none;max-width:420px}
.dtip.p{border-color:#2a5b8c}
.dc{background:none}
.gl2{position:absolute;left:0;right:0;border-top:1px solid #e3e6ea}
.gl2.b{border-top-color:#cfd3d8}
</style>
</head>

<script>
/**
 * Dashboard interaktif (vanilla JS, tanpa library).
 * Pemakaian:  mountDashboard(elemenRoot, data)
 * `data` = objek ringkasan dari flat_converter.build_json_summary():
 *   { pivot_owner:[{name, <staging>: angka, grand_total}],
 *     pivot_party:[{name, <staging>: angka, grand_total}],
 *     staging_categories, est_revenue_min, est_revenue_max, rows, ... }
 * Nilai null = tidak ada data (batang tidak digambar).
 */
(function () {
  const CAT_COLOR = { "Won": "--won", "Hot Prospect": "--hot", "Potential": "--pot", "Forecast": "--fc" };
  const fmt = (n) => Math.round(n).toLocaleString("id-ID");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Normalisasi format baru (build_json_summary) ke format internal {names, cats, values}
  function normPivot(pivot, cats) {
    if (!Array.isArray(pivot) || !pivot.length) return { names: [], cats, values: [] };
    const names = pivot.map((p) => p.name);
    const values = pivot.map((p) => cats.map((c) => {
      const v = p[c];
      return (v === null || v === undefined) ? null : Number(v);
    }));
    return { names, cats, values };
  }

  const nums = (rows) => rows.flatMap((r) => r[1]).filter((v) => typeof v === "number");

  // batas sumbu "rapi" (mis. 68,5 miliar -> 80B) dan label sumbu (B/M/K)
  function niceMax(v) {
    if (!(v > 0)) return 1;
    const e = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / e;
    const step = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => f <= s) || 10;
    return step * e;
  }
  function fmtAxis(n) {
    if (n === 0) return "0";
    const u = [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]].find(([d]) => n >= d);
    const s = u ? (n / u[0]).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + u[1] : String(n);
    return s;
  }

  // ---- Klik batang: tampilkan info batang yang diklik saja (kartu info menempel di batang) ----
  function clearPin(sec) { const p = sec.querySelector(".pin"); if (p) p.remove(); }
  function showPin(sec, el, html, onClose) {
    clearPin(sec);
    const d = document.createElement("div"); d.className = "pin";
    d.innerHTML = '<button class="x" type="button" aria-label="Tutup">\u00d7</button>' + html;
    d.onclick = (e) => e.stopPropagation();
    sec.appendChild(d);
    const s = sec.getBoundingClientRect(), b = el.getBoundingClientRect(), w = d.offsetWidth, h = d.offsetHeight;
    let left = b.left - s.left + b.width / 2 - w / 2; left = Math.max(6, Math.min(left, sec.clientWidth - w - 6));
    let top = b.top - s.top - h - 8; if (top < 6) top = b.bottom - s.top + 8;
    d.style.left = left + "px"; d.style.top = top + "px";
    d.querySelector(".x").onclick = (e) => { e.stopPropagation(); onClose(); };
  }
  function pinHTML(title, cat, v, cnt, total, scope) {
    const share = total > 0 ? (v / total) * 100 : 0;
    return `<div class="pt">${esc(title)}</div><div class="pc">${esc(cat)}</div>` +
      `<div class="pr"><span>Est Revenue</span><b>Rp ${fmt(v)}</b></div>` +
      `<div class="pr"><span>Jumlah baris</span><b>${cnt}</b></div>` +
      `<div class="pr"><span>Porsi dari total ${scope}</span><b>${share.toLocaleString("id-ID", { maximumFractionDigits: 1 })}%</b></div>`;
  }
  function countRows(rows, keyField, catField, cats) {
    const canon = {}; cats.forEach((c) => { canon[c.toLowerCase()] = c; });
    const m = {};
    for (const r of rows) {
      const k = r[keyField]; if (!k || typeof k !== "string") continue;
      const c = canon[String(r[catField] || "").trim().toLowerCase()];
      if (!c || typeof r.est_revenue !== "number") continue;
      const key = k.trim().toLowerCase() + "|" + c; m[key] = (m[key] || 0) + 1;
    }
    return m;
  }
  const cntOf = (m, name, cat) => m[String(name).trim().toLowerCase() + "|" + cat] || 0;
  let tip;
  function showTip(el, html) {
    if (!tip) { tip = document.createElement("div"); tip.id = "tip"; document.body.appendChild(tip); }
    el.onmousemove = (e) => { tip.style.display = "block"; tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 14 + "px"; tip.innerHTML = html; };
    el.onmouseleave = () => { tip.style.display = "none"; };
  }

  // ---- komponen filter bersama ----
  function checklist(host, title, names, set, cb, short) {
    const box = document.createElement("div");
    box.className = "sec";
    host.appendChild(box);
    function draw() {
      const n = set.size, t = names.length;
      box.innerHTML = `<h3>${esc(title)}</h3><div class="list ${short ? "short" : ""}"><label class="o"><input type="checkbox" class="all" ${n === t ? "checked" : ""}><span>(All)</span></label>` +
        names.map((o, i) => `<label class="o ${set.has(o) ? "on" : ""}" title="${esc(o)}"><input type="checkbox" data-i="${i}" ${set.has(o) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("") + "</div>";
      const all = box.querySelector(".all");
      all.indeterminate = n > 0 && n < t;
      all.onchange = (e) => { if (e.target.checked) names.forEach((x) => set.add(x)); else set.clear(); draw(); cb(); };
      box.querySelectorAll("[data-i]").forEach((c) => (c.onchange = () => {
        const keep = box.querySelector(".list").scrollTop, o = names[c.dataset.i];
        c.checked ? set.add(o) : set.delete(o);
        draw(); box.querySelector(".list").scrollTop = keep; cb();
      }));
    }
    draw();
  }

  function range(host, min, max, st, cb) {
    min = Math.floor(min); max = Math.ceil(max);
    if (max <= min) max = min + 1;
    const box = document.createElement("div");
    box.className = "sec";
    box.innerHTML = `<h3>Est Revenue</h3><div class="rv"><span class="lo"></span><span class="hi"></span></div><div class="rng"><div class="track"></div><div class="fill"></div><input type="range" aria-label="Est Revenue minimum"><input type="range" aria-label="Est Revenue maksimum"></div>`;
    host.appendChild(box);
    const [a, b] = box.querySelectorAll("input"), fill = box.querySelector(".fill");
    [a, b].forEach((r) => { r.min = min; r.max = max; r.step = 1; });
    a.value = min; b.value = max;
    function go(e) {
      let x = +a.value, y = +b.value;
      if (x > y) { if (e && e.target === a) { x = y; a.value = x; } else { y = x; b.value = y; } }
      st.lo = x; st.hi = y;
      const p = (v) => ((v - min) / (max - min)) * 100;
      fill.style.left = p(x) + "%"; fill.style.width = p(y) - p(x) + "%";
      a.style.zIndex = p(x) > 50 ? 3 : 1;
      box.querySelector(".lo").textContent = fmt(x); box.querySelector(".hi").textContent = fmt(y);
      cb();
    }
    a.oninput = b.oninput = go;
    go();
  }

  // Agregasi ulang pivot dari array rows (untuk filter granular). catField default "staging_category" agar dashboard lama tetap sama.
  function aggregateRows(rawRows, keyField, cats, catField) {
    catField = catField || "staging_category";
    const canon = {};
    cats.forEach((c) => { canon[c.toLowerCase()] = c; });
    const names = {}, sums = {};
    for (const r of rawRows) {
      const k = r[keyField];
      if (!k || typeof k !== "string") continue;
      const kl = k.trim().toLowerCase();
      const cat = canon[String(r[catField] || "").trim().toLowerCase()];
      if (!cat) continue;
      const v = r.est_revenue;
      if (v === null || v === undefined || typeof v !== "number") continue;
      names[kl] = k.trim();
      sums[kl] = sums[kl] || {};
      sums[kl][cat] = (sums[kl][cat] || 0) + v;
    }
    return Object.keys(names).sort().map((kl) => {
      const slot = sums[kl];
      const d = { name: names[kl] };
      let total = 0;
      for (const c of cats) {
        d[c] = slot[c] || 0;
        total += slot[c] || 0;
      }
      d.grand_total = Math.round(total * 100) / 100;
      return d;
    });
  }

  // ---- Rincian (drill-down) dari batang Sales Pipeline: Sold To Party x Transaction Type ----
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { const o = document.getElementById("detailOv"); if (o) o.remove(); } });
  function openDetail(owner, cat, rows) {
    const clean = (v) => { const t = String(v == null ? "" : v).replace(/\s+/g, " ").trim(); return t || "Null"; };
    const srt = (a, b) => (a === "Null") - (b === "Null") || a.localeCompare(b, "id", { sensitivity: "base" });
    const data = rows.filter((r) => typeof r.est_revenue === "number" && r.owner)
      .map((r) => ({ o: String(r.owner).trim(), c: clean(r.staging_category), p: clean(r.sold_to_party_group || r.sold_to_party), t: clean(r.transaction_type), v: r.est_revenue }));
    const owners = [...new Set(data.map((d) => d.o))].sort((a, b) => a.localeCompare(b, "id", { sensitivity: "base" }));
    const parties = [...new Set(data.map((d) => d.p))].sort(srt), allCats = [...new Set(data.map((d) => d.c))].sort(srt);
    const st = { cats: new Set(allCats.filter((c) => c.toLowerCase() === String(cat).trim().toLowerCase())), owners: new Set(owners.filter((o) => o.toLowerCase() === String(owner).trim().toLowerCase())), parties: new Set(parties) };
    const old = document.getElementById("detailOv"); if (old) old.remove();
    const ov = document.createElement("div"); ov.id = "detailOv";
    ov.innerHTML = '<div class="panel"><div class="dash" style="border:0;padding:0"><div class="chart"><h1>Rincian <span class="unit"></span></h1><p class="meta sum"></p><div class="dh"><span>Sold To Party</span><span>Transaction Type</span></div><div class="drows"></div><div class="dfoot"></div></div><aside><button type="button" class="btn dclose" style="width:100%;margin-bottom:14px">Tutup \u00d7</button></aside></div></div>';
    document.body.appendChild(ov);
    const tp = document.createElement("div"); tp.className = "dtip"; tp.style.display = "none"; ov.appendChild(tp);
    let pinned = false;
    const unpin = () => { pinned = false; tp.style.display = "none"; tp.classList.remove("p"); };
    const place = (x, y) => { tp.style.left = Math.max(4, Math.min(x + 14, window.innerWidth - tp.offsetWidth - 8)) + "px"; tp.style.top = Math.max(4, Math.min(y + 14, window.innerHeight - tp.offsetHeight - 8)) + "px"; };
    const close = () => ov.remove();
    ov.onclick = (e) => { unpin(); if (e.target === ov) close(); };
    ov.querySelector(".dclose").onclick = close;
    const out = ov.querySelector(".drows"), foot = ov.querySelector(".dfoot"), side = ov.querySelector("aside");
    const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t)), C0 = [211, 229, 244], C1 = [42, 91, 140];
    const nf = (v, d) => v.toLocaleString("id-ID", { maximumFractionDigits: d });
    const cmp = (v) => { const a = Math.abs(v); return a >= 1e9 ? nf(v / 1e9, 2) + " M" : a >= 1e6 ? nf(v / 1e6, 2) + " jt" : fmt(v); };
    const tickUnit = (v) => { if (!(v > 0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(v / 3))); for (const f of [1, 2, 2.5, 5, 10]) if (f * e * 3 >= v) return f * e; return 10 * e; };
    const tipHTML = (p, t, v) => '<div style="display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:13px"><span style="color:#6f7b8a">Sold To Party:</span><b>' + esc(p) + '</b><span style="color:#6f7b8a">Transaction Type:</span><b>' + esc(t) + '</b><span style="color:#6f7b8a">Est Revenue:</span><b>' + fmt(v) + '</b></div>';
    function draw() {
      unpin();
      const sel = data.filter((d) => st.owners.has(d.o) && st.parties.has(d.p) && st.cats.has(d.c)), m = new Map(), ts = new Set();
      sel.forEach((d) => { const o = m.get(d.p) || {}; o[d.t] = (o[d.t] || 0) + d.v; m.set(d.p, o); ts.add(d.t); });
      const types = [...ts].sort(srt);
      const list = [...m.entries()].map(([p, o]) => ({ p, o, tot: Object.values(o).reduce((a, b) => a + b, 0) })).sort((a, b) => b.tot - a.tot);
      let max = 0, tot = 0, marks = 0;
      list.forEach((r) => types.forEach((t) => { const v = r.o[t]; if (v !== undefined) { max = Math.max(max, v); tot += v; marks++; } }));
      const U = max > 0 ? Math.pow(10, Math.floor(Math.log10(max))) : 1, AX = (Math.floor(max / U) + 1) * U, NT = Math.round(AX / U), cols = "260px repeat(" + Math.max(1, types.length) + ",1fr)";
      const on = owners.filter((o) => st.owners.has(o)), oc = allCats.filter((c) => st.cats.has(c));
      const tk = []; for (let k = NT; k >= 0; k--) tk.push(k);
      const tickHTML = tk.map((k) => '<span style="top:' + ((1 - k / NT) * 100) + '%;transform:translateY(-50%)">' + (k === 0 ? (AX >= 1e9 ? "0B" : "0") : fmtAxis(U * k)) + "</span>").join("");
      const gridHTML = tk.map((k) => '<i class="gl2' + (k === 0 ? " b" : "") + '" style="top:' + ((1 - k / NT) * 100) + '%"></i>').join("");
      ov.querySelector(".unit").textContent = [on.length === 0 ? "" : on.length <= 2 ? on.join(", ") : on.length + " owner", oc.length === 0 ? "" : oc.length <= 2 ? oc.join(", ") : oc.length + " kategori"].filter(Boolean).join(" \u00b7 ");
      ov.querySelector(".sum").textContent = marks + " marks \u00b7 " + sel.length + " baris \u00b7 SUM(Est Revenue): " + fmt(tot) + " \u00b7 label: M = miliar, jt = juta (nilai lengkap: arahkan kursor / klik batang)";
      const gm = side.querySelector(".gmax"); if (gm) gm.textContent = fmt(max);
      ov.querySelector(".dh").style.gridTemplateColumns = "260px 1fr";
      foot.style.gridTemplateColumns = cols;
      foot.innerHTML = "<span></span>" + types.map((t) => '<span title="' + esc(t) + '">' + esc(t) + "</span>").join("");
      if (!list.length) { out.innerHTML = '<div class="empty">Tidak ada data untuk pilihan ini.</div>'; return; }
      const info = [];
      out.innerHTML = list.map((r) => '<div class="dr" style="grid-template-columns:190px 26px 44px repeat(' + types.length + ',1fr)"><div class="who" title="' + esc(r.p) + '">' + esc(r.p) + '</div><div class="yl">Est Revenue</div><div class="dt">' + tickHTML + '</div>' + types.map((t) => {
        const v = r.o[t]; if (v === undefined) return '<div class="dc">' + gridHTML + '</div>';
        const k = max > 0 ? Math.max(0, v) / max : 0, h = Math.max(0, v) / AX * 100, inside = h > 82;
        info.push(tipHTML(r.p, t, v));
        return '<div class="dc" data-i="' + (info.length - 1) + '">' + gridHTML + '<div class="db" style="height:' + h + '%;background:rgb(' + mix(C0, C1, k) + ')"></div><div class="dl" style="bottom:' + (inside ? "3px;color:#fff" : "calc(" + h + "% + 2px)") + '">' + cmp(v) + '</div></div>';
      }).join("") + '</div>').join("");
      out.querySelectorAll(".dc[data-i]").forEach((c) => {
        const html = info[+c.dataset.i];
        c.onmousemove = (e) => { if (pinned) return; tp.innerHTML = html; tp.style.display = "block"; place(e.clientX, e.clientY); };
        c.onmouseleave = () => { if (!pinned) tp.style.display = "none"; };
        c.onclick = (e) => { e.stopPropagation(); pinned = true; tp.classList.add("p"); tp.innerHTML = html; tp.style.display = "block"; place(e.clientX, e.clientY); };
      });
    }
    checklist(side, "Staging Category", allCats, st.cats, draw, true);
    checklist(side, "Owner", owners, st.owners, draw, true);
    checklist(side, "Sold To Party", parties, st.parties, draw, false);
    side.insertAdjacentHTML("beforeend", '<div class="sec"><h3>SUM(Est Revenue)</h3><div class="grad">0<i></i><span class="gmax"></span></div></div>');
    draw();
  }

  // ---- Dashboard 1: SALES PIPELINE (Owner x Staging Category) ----
  function buildPipeline(sec, pivot, revMin, revMax, rawRows) {
    const { names: ownerNames, cats: allCats, values: ownerVals } = normPivot(pivot, ["Won", "Hot Prospect", "Potential", "Forecast"]);
    const rows = ownerNames.map((name, i) => [name, ownerVals[i]]);
    sec.innerHTML = `<div class="chart"><h1>SALES PIPELINE</h1><div class="head"><span>Owner</span><span>Staging Category</span></div><div class="rows"></div><div class="foot"><span></span><div class="cats"></div></div></div><aside></aside>`;
    const side = sec.querySelector("aside"), out = sec.querySelector(".rows");
    const all = nums(rows);
    // BUG FIX: initialize lo/hi to actual data range, not 0/0 (which filters out all positive revenue)
    const dataMin = revMin != null ? Number(revMin) : (all.length ? Math.min(...all) : 0);
    const dataMax = revMax != null ? Number(revMax) : (all.length ? Math.max(...all) : 1);
    const st = { owners: new Set(rows.map((r) => r[0])), cats: new Set(allCats), lo: dataMin, hi: dataMax, hl: null, sel: null };
    const AX = niceMax(Math.max(0, ...all));

    function draw() {
      clearPin(sec);
      const cats = allCats.filter((c) => st.cats.has(c));
      sec.querySelector(".cats").innerHTML = cats.map((c) => `<span>${esc(c)}</span>`).join("");
      // Filter granular: hitung ulang pivot dari rawRows berdasarkan est_revenue range
      let filteredRows = rawRows;
      if (rawRows && rawRows.length) {
        filteredRows = rawRows.filter((r) => {
          const v = r.est_revenue;
          if (v === null || v === undefined || typeof v !== "number") return false;
          return v >= st.lo && v <= st.hi;
        });
      }
      const agg = aggregateRows(filteredRows, "owner", cats);
      const show = agg.filter((r) => st.owners.has(r.name));
      if (st.sel) { const rr = show.find((r) => r.name === st.sel.n); if (!rr || !cats.includes(st.sel.c) || !rr[st.sel.c]) st.sel = null; }
      if (!rows.length) { out.innerHTML = '<div class="empty">Tidak ada data Owner x Staging Category.</div>'; return; }
      if (!show.length) { out.innerHTML = '<div class="empty">Tidak ada owner yang dipilih. Centang minimal satu owner di sebelah kanan.</div>'; return; }
      out.innerHTML = show.map((r) => {
        const vals = cats.map((c) => r[c]);
        const cols = vals.map((v, i) => {
          // BUG FIX: jangan filter nilai agregat dengan st.lo/st.hi — nilai agregat bisa jauh lebih besar dari revenue per row
          if (v == null || v === 0) return '<div class="col"></div>';
          const h = (v / AX) * 100, isSel = !!st.sel && st.sel.n === r.name && st.sel.c === cats[i];
          const dim = (st.hl !== null && st.hl !== i) || (!!st.sel && !isSel);
          return `<div class="col" style="opacity:${dim ? 0.22 : 1}"><div class="bar${isSel ? " sel" : ""}" style="height:${h}%;background:var(${CAT_COLOR[cats[i]]})" data-o="${esc(r.name)}" data-i="${i}" data-v="${v}"></div><div class="val" style="bottom:calc(${h}% + 3px);${st.sel && !isSel ? "visibility:hidden" : ""}">${fmt(v)}</div></div>`;
        }).join("");
        return `<div class="row"><div class="who">${esc(r.name)}</div><div class="yl">Est Revenue</div><div class="plot"><span class="tick" style="bottom:100%">${fmtAxis(AX)}</span><span class="tick" style="bottom:50%">${fmtAxis(AX / 2)}</span><span class="tick" style="bottom:0">0</span><div class="gl" style="bottom:100%"></div><div class="gl" style="bottom:50%"></div><div class="gl" style="bottom:0"></div><div class="bars" style="grid-template-columns:repeat(${cats.length},1fr)">${cols}</div></div></div>`;
      }).join("");
      out.querySelectorAll(".bar").forEach((b) => {
        b.onclick = (e) => {
          e.stopPropagation();
          openDetail(b.dataset.o, cats[b.dataset.i], rawRows);
        };
      });
      if (st.sel) {
        const b = out.querySelector(".bar.sel"), rr = show.find((r) => r.name === st.sel.n);
        if (b && rr) {
          const cm = countRows(filteredRows, "owner", "staging_category", cats), tot = cats.reduce((a, c) => a + (rr[c] || 0), 0);
          showPin(sec, b, pinHTML(rr.name, st.sel.c, rr[st.sel.c], cntOf(cm, rr.name, st.sel.c), tot, "owner") + '<button type="button" class="drill">Lihat rincian \u203a</button>', () => { st.sel = null; draw(); });
          const dr = sec.querySelector(".pin .drill");
          if (dr) { const so = rr.name, sc = st.sel.c; dr.onclick = (e) => { e.stopPropagation(); openDetail(so, sc, filteredRows); }; }
        }
      }
    }
    out.onclick = () => { if (st.sel) { st.sel = null; draw(); } };
    sec.__clear = () => { if (st.sel) { st.sel = null; draw(); } };
    function legend() {
      const box = side.querySelector(".leg");
      if (!box) return;
      const cats = allCats.filter((c) => st.cats.has(c));
      box.innerHTML = cats.map((c, i) => `<button class="lg ${st.hl === i ? "sel" : ""}" data-i="${i}" aria-pressed="${st.hl === i}"><i style="background:var(${CAT_COLOR[c]})"></i>${esc(c)}</button>`).join("");
      box.querySelectorAll(".lg").forEach((b) => (b.onclick = () => { st.sel = null; st.hl = st.hl === +b.dataset.i ? null : +b.dataset.i; legend(); draw(); }));
    }
    checklist(side, "Owner", rows.map((r) => r[0]), st.owners, draw, true);
    checklist(side, "Staging Category", allCats, st.cats, draw, false);
    range(side, dataMin, dataMax, st, draw);
    side.insertAdjacentHTML("beforeend", '<div class="sec"><h3>Highlight</h3><div class="leg"></div></div>');
    legend(); draw();
  }

  // ---- Dashboard 3: STAGING CATEGORY (Owner x Transaction Type, filter Sold To Party) ----
  const fmtHM = (n) => (n / 1e9).toLocaleString("id-ID", { minimumFractionDigits: 1, maximumFractionDigits: 2 });
  // Label batang: miliar + akhiran "M"; nilai positif yang sangat kecil ditampilkan "<0,01 M" (nilai persis ada di tooltip)
  const fmtBar = (n) => (n > 0 && n < 5e6 ? "<0,01 M" : fmtHM(n) + " M");
  function buildTxType(sec, data, revMin, revMax) {
    const cleanTxt = (v, empty) => { const t = String(v == null ? "" : v).replace(/\s+/g, " ").trim(); return t || empty; };
    const rawRows = (Array.isArray(data.rows) ? data.rows : []).map((r) => ({ ...r, transaction_type: cleanTxt(r.transaction_type, "Null"), _party: cleanTxt(r.sold_to_party_group || r.sold_to_party, "Null") }));
    const nullLast = (a, b) => (a === "Null" ? 1 : b === "Null" ? -1 : a.localeCompare(b, "id", { sensitivity: "base" }));
    const nullFirst = (a, b) => (a === "Null" ? -1 : b === "Null" ? 1 : a.localeCompare(b, "id", { sensitivity: "base" }));
    const allOwners = [...new Set(rawRows.map((r) => r.owner).filter(Boolean))].sort();
    const allTypes = [...new Set(rawRows.map((r) => r.transaction_type))].sort(nullLast);
    const allParties = [...new Set(rawRows.map((r) => r._party))].sort(nullFirst);
    sec.innerHTML = `<div class="chart"><h1>STAGING CATEGORY <span class="unit">(nilai dalam Miliar Rupiah)</span></h1><p class="meta sum"></p><div class="head"><span>Owner</span><span>Transaction Type</span></div><div class="rows"></div><div class="foot"><span></span><div class="cats"></div></div></div><aside></aside>`;
    const side = sec.querySelector("aside"), out = sec.querySelector(".rows");
    const initAgg = aggregateRows(rawRows, "owner", allTypes, "transaction_type");
    const all = initAgg.flatMap((r) => allTypes.map((c) => r[c])).filter((v) => typeof v === "number");
    const dataMin = revMin != null ? Number(revMin) : (all.length ? Math.min(...all) : 0);
    const dataMax = revMax != null ? Number(revMax) : (all.length ? Math.max(...all) : 1);
    const st = { owners: new Set(allOwners), types: new Set(allTypes), parties: new Set(allParties), lo: dataMin, hi: dataMax, sel: null };
    const AX = niceMax(Math.max(0, ...all));
    function draw() {
      clearPin(sec);
      const selTypes = allTypes.filter((c) => st.types.has(c));
      const catsBox = sec.querySelector(".cats");
      const filteredRows = rawRows.filter((r) => {
        const v = r.est_revenue;
        if (v === null || v === undefined || typeof v !== "number" || v < st.lo || v > st.hi) return false;
        return st.parties.has(r._party);
      });
      const agg = aggregateRows(filteredRows, "owner", selTypes, "transaction_type");
      const cats = selTypes.filter((c) => agg.some((r) => st.owners.has(r.name) && r[c]));
      catsBox.style.gridTemplateColumns = "repeat(" + Math.max(1, cats.length) + ",1fr)";
      catsBox.innerHTML = cats.map((c) => `<span>${esc(c)}</span>`).join("");
      let sTot = 0, sMarks = 0;
      agg.forEach((r) => { if (!st.owners.has(r.name)) return; cats.forEach((c) => { if (r[c]) { sTot += r[c]; sMarks++; } }); });
      const sRows = filteredRows.filter((r) => st.types.has(r.transaction_type) && st.owners.has(r.owner)).length;
      sec.querySelector(".sum").textContent = sMarks + " marks \u00b7 " + sRows + " baris \u00b7 SUM(Est Revenue): " + fmt(sTot);
      const show = agg.filter((r) => st.owners.has(r.name));
      if (st.sel) { const rr = show.find((r) => r.name === st.sel.n); if (!rr || !cats.includes(st.sel.c) || !rr[st.sel.c]) st.sel = null; }
      if (!allOwners.length) { out.innerHTML = '<div class="empty">Tidak ada data Owner x Transaction Type.</div>'; return; }
      if (!show.length || !cats.length) { out.innerHTML = '<div class="empty">Tidak ada owner/tipe transaksi yang dipilih untuk filter ini.</div>'; return; }
      out.innerHTML = show.map((r) => {
        const cols = cats.map((c, i) => {
          const v = r[c];
          if (v == null || v === 0) return '<div class="col"></div>';
          const h = (v / AX) * 100, isSel = !!st.sel && st.sel.n === r.name && st.sel.c === c, dim = !!st.sel && !isSel;
          return `<div class="col" style="opacity:${dim ? 0.22 : 1}"><div class="bar${isSel ? " sel" : ""}" style="height:${h}%;background:var(--fc)" data-o="${esc(r.name)}" data-i="${i}" data-v="${v}"></div><div class="val" style="bottom:calc(${h}% + 3px);${dim ? "visibility:hidden" : ""}">${fmtBar(v)}</div></div>`;
        }).join("");
        return `<div class="row"><div class="who">${esc(r.name)}</div><div class="yl">Est Revenue</div><div class="plot"><span class="tick" style="bottom:100%">${fmtHM(AX)}</span><span class="tick" style="bottom:50%">${fmtHM(AX / 2)}</span><span class="tick" style="bottom:0">0</span><div class="gl" style="bottom:100%"></div><div class="gl" style="bottom:50%"></div><div class="gl" style="bottom:0"></div><div class="bars" style="grid-template-columns:repeat(${cats.length},1fr)">${cols}</div></div></div>`;
      }).join("");
      out.querySelectorAll(".bar").forEach((b) => {
        b.onclick = (e) => {
          e.stopPropagation();
          const n = b.dataset.o, c = cats[b.dataset.i];
          st.sel = st.sel && st.sel.n === n && st.sel.c === c ? null : { n, c };
          draw();
        };
      });
      if (st.sel) {
        const b = out.querySelector(".bar.sel"), rr = show.find((r) => r.name === st.sel.n);
        if (b && rr) {
          const cm = countRows(filteredRows, "owner", "transaction_type", cats), tot = cats.reduce((a, c) => a + (rr[c] || 0), 0);
          showPin(sec, b, pinHTML(rr.name, st.sel.c, rr[st.sel.c], cntOf(cm, rr.name, st.sel.c), tot, "owner"), () => { st.sel = null; draw(); });
        }
      }
    }
    out.onclick = () => { if (st.sel) { st.sel = null; draw(); } };
    sec.__clear = () => { if (st.sel) { st.sel = null; draw(); } };
    checklist(side, "Sold To Party", allParties, st.parties, draw, false);
    checklist(side, "Owner", allOwners, st.owners, draw, true);
    checklist(side, "Transaction Type", allTypes, st.types, draw, false);
    range(side, dataMin, dataMax, st, draw);
    draw();
  }

  window.mountDashboard = function (root, data) {
    root.innerHTML = `<div class="tabs" role="tablist"><button role="tab" data-t="d1" aria-selected="true">SALES PIPELINE</button><button role="tab" data-t="d2" aria-selected="false">CUSTOMER DASHBOARD</button><button role="tab" data-t="d3" aria-selected="false">STAGING CATEGORY</button></div><section class="dash" data-d="d1"></section><section class="dash" data-d="d2" hidden></section><section class="dash" data-d="d3" hidden></section>`;
    const s1 = root.querySelector('[data-d="d1"]'), s2 = root.querySelector('[data-d="d2"]'), s3 = root.querySelector('[data-d="d3"]');
    // Pass raw values to buildPipeline/buildParty so they can distinguish 0 from null/undefined
    const revMin = data.est_revenue_min;
    const revMax = data.est_revenue_max;
    const rawRows = Array.isArray(data.rows) ? data.rows : [];
    buildPipeline(s1, data.pivot_owner, revMin, revMax, rawRows);
    buildParty(s2, data.pivot_party, revMin, revMax, rawRows);
    buildTxType(s3, data, revMin, revMax);
    root.querySelectorAll(".tabs button").forEach((btn) => (btn.onclick = () => {
      root.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === btn));
      s1.hidden = btn.dataset.t !== "d1";
      s2.hidden = btn.dataset.t !== "d2";
      s3.hidden = btn.dataset.t !== "d3";
    }));
  };
})();

</script>

<script>
(function () {
  const notice = (cls, html) => { document.getElementById("msg").innerHTML = html ? '<div class="notice ' + cls + '">' + html + '</div>' : ""; };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STAGING_CATS = ["Won", "Hot Prospect", "Potential", "Forecast"];
  const IGNORE = new Set(["summary", "total", "grand total"]);
  const BASE_ALIASES = {
    owner: ["owner"], staging: ["staging category"], business_type: ["business type"],
    created_on: ["created on"], topic: ["topic"], area: ["site triatra", "area"],
    transaction_type: ["transaction type"], sold_to_party: ["sold to party"],
    close_date: ["close date"], revenue: ["revenue"],
  };
  // Konfigurasi 3 sumber, sesuai logic coba0.ipynb
  const SOURCE_CONFIGS = [
    { key: "pipeline", target_stagings: ["Forecast", "Hot Prospect", "Potential"], forced_staging: null, overrides: {} },
    { key: "contract", target_stagings: null, forced_staging: "Won", overrides: { topic: ["name"], revenue: ["total amount sales price"] } },
    { key: "noncontract", target_stagings: null, forced_staging: "Won", overrides: { close_date: ["actual close date"], revenue: ["actual revenue"] } },  // Won = revenue realisasi (kolom "Actual Revenue" di file Closewon Non Contract)
  ];

  function mergeAliases(ov) { const m = {}; for (const k in BASE_ALIASES) m[k] = BASE_ALIASES[k].slice(); for (const k in (ov || {})) m[k] = ov[k].slice(); return m; }
  function findHeader(aoa, aliases, maxScan = 20) {
    let bestRow = -1, bestMap = {}, bestScore = 0;
    for (let r = 0; r < Math.min(maxScan, aoa.length); r++) {
      const row = aoa[r] || [], texts = {};
      row.forEach((v, c) => { if (typeof v === "string" && v.trim()) texts[c] = v.trim().toLowerCase(); });
      const map = {}; let score = 0;
      for (const field in aliases) for (const c in texts) { if (aliases[field].some((a) => texts[c].includes(a))) { map[field] = +c; score++; break; } }
      if (score > bestScore) { bestRow = r; bestMap = map; bestScore = score; }
    }
    if (bestRow < 0 || bestScore < 4) throw new Error("baris header tidak ditemukan (cek nama kolom)");
    return { headerRow: bestRow, colMap: bestMap };
  }
  function looksLikeDate(v) { if (v instanceof Date) return true; if (typeof v === "string") return /^\s*(\d{1,2}[/-]\d{1,2}[/-]\d{2,4}|\d{4}[/-]\d{1,2}[/-]\d{1,2})/.test(v); return false; }
  function cellText(row, colMap, field) { const c = colMap[field]; if (c === undefined) return null; let v = row[c]; if (typeof v === "string") v = v.trim(); return v === "" ? null : (v ?? null); }
  // Parser angka toleran untuk revenue yang tersimpan sebagai teks: "Rp72,500,000.00" (format EN), "Rp72.500.000,50" (format ID), "(1.000)" (negatif)
  function parseNum(v) {
    if (typeof v === "number") return Number.isFinite(v) ? v : null;
    if (v == null) return null;
    let s = String(v).trim();
    const neg = /^\(.*\)$/.test(s) || /^-/.test(s.replace(/^[^0-9()-]*/, ""));
    s = s.replace(/[^0-9.,]/g, "");
    if (!s) return null;
    const lastDot = s.lastIndexOf("."), lastComma = s.lastIndexOf(",");
    if (lastDot >= 0 && lastComma >= 0) {
      // dua jenis pemisah: yang paling akhir = desimal, yang lain = ribuan
      const dec = lastDot > lastComma ? "." : ",", thou = dec === "." ? "," : ".";
      s = s.split(thou).join("").replace(dec, ".");
    } else if (lastDot >= 0 || lastComma >= 0) {
      const sep = lastDot >= 0 ? "." : ",", cnt = s.split(sep).length - 1, tail = s.length - s.lastIndexOf(sep) - 1;
      if (cnt > 1 || tail === 3) s = s.split(sep).join("");   // ribuan
      else s = s.replace(sep, ".");                            // desimal
    }
    const n = Number(s);
    return Number.isFinite(n) ? (neg ? -n : n) : null;
  }
  function isIgnorable(t) { return !!t && IGNORE.has(String(t).trim().toLowerCase()); }

  function extractFlatRows(aoa, headerRow, colMap, ownersSetLower, targetStagings, forcedStaging) {
    const results = []; let curOwner = null, curStaging = null;
    const stagingsLower = targetStagings ? new Set(targetStagings.map((s) => s.toLowerCase())) : null;
    for (let r = headerRow + 1; r < aoa.length; r++) {
      const row = aoa[r] || [];
      const createdOn = cellText(row, colMap, "created_on"), ownerVal = cellText(row, colMap, "owner"), stagingVal = cellText(row, colMap, "staging");
      if (!looksLikeDate(createdOn)) {
        if (ownerVal && !isIgnorable(ownerVal)) { curOwner = ownerVal; curStaging = null; }
        else if (stagingVal && !isIgnorable(stagingVal)) { curStaging = stagingVal; }
        continue;
      }
      const ownerMatch = curOwner && ownersSetLower.has(curOwner.trim().toLowerCase());
      let stagingMatch, stagingForRow;
      if (forcedStaging) { stagingMatch = true; stagingForRow = forcedStaging; }
      else { stagingMatch = !!stagingsLower && stagingsLower.has((curStaging || "").trim().toLowerCase()); stagingForRow = curStaging; }
      if (ownerMatch && stagingMatch) {
        const revRaw = cellText(row, colMap, "revenue");
        results.push({
          created_on: createdOn, topic: cellText(row, colMap, "topic"), owner: curOwner,
          area: cellText(row, colMap, "area"), sold_to_party: cellText(row, colMap, "sold_to_party"),
          transaction_type: cellText(row, colMap, "transaction_type"), est_close_date: cellText(row, colMap, "close_date"),
          est_revenue: parseNum(revRaw),
          staging_category: stagingForRow,
        });
      }
    }
    return results;
  }
  function readWorkbook(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = (e) => { try { res(XLSX.read(e.target.result, { type: "array", cellDates: true })); } catch (err) { rej(err); } };
      fr.onerror = () => rej(new Error("gagal membaca file"));
      fr.readAsArrayBuffer(file);
    });
  }
  function buildPivot(rows, keyField, normalize) {
    const map = new Map();
    rows.forEach((r) => {
      let name = r[keyField] || "(Kosong)";
      if (normalize) name = normalize(name);
      if (!map.has(name)) map.set(name, Object.fromEntries(STAGING_CATS.map((c) => [c, 0])));
      const v = typeof r.est_revenue === "number" ? r.est_revenue : 0;
      if (STAGING_CATS.includes(r.staging_category)) map.get(name)[r.staging_category] += v;
    });
    return [...map.entries()].map(([name, vals]) => ({ name, ...vals, grand_total: STAGING_CATS.reduce((s, c) => s + vals[c], 0) }));
  }
  // Semua Sold To Party milik grup ini digabung revenue-nya jadi satu baris "PT Bukit Makmur":
  //  - "BUMA IPR", "BUMA BINUNGAN", dst. (kata BUMA berdiri sendiri)
  //  - "PT BUKIT MAKMUR MANDIRI UTAMA"
  // Nama lain dirapikan (trim + spasi ganda) agar konsisten antara pivot, chart, dan export Excel.
  const BUKIT_MAKMUR = "PT Bukit Makmur";
  const BUKIT_MAKMUR_RE = /BUKIT\s+MAKMUR\s+MANDIRI\s+UTAMA|\bBUMA\s+(BINUNGAN|IPR)\b/i;
  function normalizeParty(name) {
    const s = String(name == null ? "" : name).replace(/\s+/g, " ").trim();
    if (!s) return "(Kosong)";
    return BUKIT_MAKMUR_RE.test(s) ? BUKIT_MAKMUR : s;
  }
  function buildDashboardData(rowsIn) {
    // sold_to_party_group dipakai untuk pivot & chart PT DASH; sold_to_party asli tetap disimpan untuk export Flat Format
    const rows = rowsIn.map((r) => ({ ...r, sold_to_party_group: normalizeParty(r.sold_to_party || "(Kosong)") }));
    const revs = rows.map((r) => (typeof r.est_revenue === "number" ? r.est_revenue : 0));
    return {
      generated_at: new Date().toISOString(), row_count: rows.length, staging_categories: STAGING_CATS,
      est_revenue_min: revs.length ? Math.min(...revs) : 0, est_revenue_max: revs.length ? Math.max(...revs) : 1,
      pivot_owner: buildPivot(rows, "owner"), pivot_party: buildPivot(rows, "sold_to_party_group"), rows,
    };
  }

  let allOwners = [], selectedOwners = new Set();

  function getFiles() { return { pipeline: $("f_pipeline").files[0], contract: $("f_contract").files[0], noncontract: $("f_noncontract").files[0] }; }

  // Owner yang tidak dimasukkan ke daftar (dicocokkan tanpa memperhatikan huruf besar/kecil, spasi ganda, dan tanda #)
  const EXCLUDED_OWNERS = new Set([
    "AHMAD RIZAL RENDIANSYAH", "AQIS NUR KHOLIS", "Allen Denisyola Dian Sukoco", "ARKA WIBOWO", "BERTHA NARENDRA",
    "MUHAMMAD HAFIZH RAFI", "NAUFAL ARIQ TAUFIQ", "REZA OCTAPRASETYA PERMADI", "Stephanus Nicolaus", "UMAR CHOLIDY",
    "Yoga Lintang Fahrezi", "INFORMATION TECHNOLOGY", "SYSTEM", "Adhi Prasetyo",
  ].map((n) => n.replace(/\s+/g, " ").trim().toLowerCase()));
  const isExcludedOwner = (n) => EXCLUDED_OWNERS.has(String(n).replace(/#/g, "").replace(/\s+/g, " ").trim().toLowerCase());

  function scanOwnersFromAOA(aoa, headerRow, colMap, set) {
    for (let r = headerRow + 1; r < aoa.length; r++) {
      const row = aoa[r] || [];
      const createdOn = cellText(row, colMap, "created_on"), ownerVal = cellText(row, colMap, "owner");
      if (!looksLikeDate(createdOn) && ownerVal && !isIgnorable(ownerVal) && !isExcludedOwner(ownerVal)) set.add(String(ownerVal).trim());
    }
  }

  function renderOwnerChecklist() {
    const box = $("ownerBox");
    if (!allOwners.length) { box.innerHTML = "Tidak ada nama Owner terdeteksi di ketiga file."; return; }
    const n = selectedOwners.size, t = allOwners.length;
    box.innerHTML = '<label style="display:flex;align-items:center;gap:6px;margin-bottom:4px;cursor:pointer"><input type="checkbox" class="all" ' + (n === t ? "checked" : "") + '><b>(Semua &mdash; ' + t + ' owner)</b></label>' +
      allOwners.map((o) => '<label style="display:flex;align-items:center;gap:6px;padding:1px 0;cursor:pointer"><input type="checkbox" data-o="' + esc(o) + '" ' + (selectedOwners.has(o) ? "checked" : "") + '><span>' + esc(o) + '</span></label>').join("");
    box.querySelector(".all").onchange = (e) => { selectedOwners = e.target.checked ? new Set(allOwners) : new Set(); renderOwnerChecklist(); };
    box.querySelectorAll("[data-o]").forEach((c) => (c.onchange = () => { c.checked ? selectedOwners.add(c.dataset.o) : selectedOwners.delete(c.dataset.o); renderOwnerChecklist(); }));
  }

  async function scanAllOwners() {
    const files = getFiles();
    if (!files.pipeline || !files.contract || !files.noncontract) return;
    notice("ok", "Mendeteksi nama Owner dari 3 file&hellip;");
    try {
      const set = new Set();
      for (const cfg of SOURCE_CONFIGS) {
        const wb = await readWorkbook(files[cfg.key]);
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: null });
        const { headerRow, colMap } = findHeader(aoa, mergeAliases(cfg.overrides));
        scanOwnersFromAOA(aoa, headerRow, colMap, set);
      }
      allOwners = [...set].sort((a, b) => a.localeCompare(b));
      selectedOwners = new Set(allOwners);
      renderOwnerChecklist();
      $("btnProcess").disabled = !allOwners.length;
      notice(allOwners.length ? "ok" : "warn", allOwners.length ? allOwners.length + " nama Owner terdeteksi. Silakan klik Proses." : "Tidak ada nama Owner yang terdeteksi, cek struktur file.");
    } catch (err) { notice("err", "Gagal mendeteksi Owner: " + esc(err.message)); }
  }
  ["f_pipeline", "f_contract", "f_noncontract"].forEach((id) => ($(id).onchange = scanAllOwners));

  async function processAll() {
    const files = getFiles();
    if (!files.pipeline || !files.contract || !files.noncontract) { notice("err", "Mohon unggah ketiga file Excel (Pipeline, Contract, Non Contract)."); return; }
    if (!selectedOwners.size) { notice("err", "Centang minimal satu nama Owner."); return; }
    const ownersRaw = [...selectedOwners];
    const ownersSetLower = new Set(ownersRaw.map((o) => o.toLowerCase()));
    notice("ok", "Memproses file&hellip;");
    try {
      let allRows = [];
      const diag = [];
      for (const cfg of SOURCE_CONFIGS) {
        const wb = await readWorkbook(files[cfg.key]);
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: null });
        const { headerRow, colMap } = findHeader(aoa, mergeAliases(cfg.overrides));
        const srcRows = extractFlatRows(aoa, headerRow, colMap, ownersSetLower, cfg.target_stagings, cfg.forced_staging);
        const kosong = srcRows.filter((r) => r.est_revenue == null).length;
        diag.push(cfg.key + ": " + srcRows.length + " baris" + (kosong ? " (" + kosong + " revenue kosong/gagal dibaca)" : ""));
        allRows.push(...srcRows);
      }
      const data = buildDashboardData(allRows);
      window.mountDashboard($("root"), data);
      window.__pivotData = data;
      $("btnPivot").disabled = false;
      $("btnPres").disabled = false;
      $("meta").textContent = allRows.length + " baris \u2022 " + ownersRaw.length + " owner \u2022 " + diag.join(" | ");
      notice(allRows.length ? "ok" : "warn", allRows.length ? "Dashboard berhasil dibuat dari 3 file." : "Dashboard dibuat, tapi tidak ada baris yang cocok untuk Owner tersebut.");
    } catch (err) { notice("err", "Gagal memproses: " + esc(err.message)); }
  }

  function downloadPivot() {
    const d = window.__pivotData; if (!d) return;
    const withTotal = (head, pv) => {
      const rows = pv.map((p) => [p.name, ...STAGING_CATS.map((c) => p[c] || 0), p.grand_total]);
      const tot = ["Grand Total", ...STAGING_CATS.map((c) => pv.reduce((s, p) => s + (p[c] || 0), 0)), pv.reduce((s, p) => s + p.grand_total, 0)];
      return [[head, ...STAGING_CATS, "Grand Total"], ...rows, tot];
    };
    const ownerAOA = withTotal("Owner", d.pivot_owner);
    const partyAOA = withTotal("Sold To Party", d.pivot_party);
    // Flat Format: SOLD TO PARTY sudah digabung (BUMA); nama asli dari file sumber tetap ada di kolom terakhir
    const fh = ["CREATED ON", "TOPIC", "OWNER", "AREA", "SOLD TO PARTY", "TRANSACTION TYPE", "EST CLOSE DATE", "EST REVENUE", "STAGING CATEGORY", "OPPTY", "SOLD TO PARTY (ASLI)"];
    const flatAOA = [fh, ...d.rows.map((r) => [r.created_on, r.topic, r.owner, r.area, r.sold_to_party_group || normalizeParty(r.sold_to_party), r.transaction_type, r.est_close_date, r.est_revenue == null ? 0 : r.est_revenue, r.staging_category,
      ["Hot Prospect", "Forecast", "Potential"].includes(r.staging_category) ? "OPTY" : (r.staging_category === "Won" ? "Won" : ""), r.sold_to_party]) ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ownerAOA), "Pivot Owner");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(partyAOA), "Pivot Party");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(flatAOA, { cellDates: true }), "Flat Format");
    XLSX.writeFile(wb, "Pivot Sales Pipeline.xlsx", { cellDates: true });
  }

  const fmtR = (n) => Math.round(n).toLocaleString("id-ID");
  function buildPresentation(d) {
    const sum = (c) => d.pivot_owner.reduce((s, p) => s + (p[c] || 0), 0);
    const totalAll = STAGING_CATS.reduce((s, c) => s + sum(c), 0);
    const ownersSorted = [...d.pivot_owner].sort((a, b) => b.grand_total - a.grand_total);
    const partiesSorted = [...d.pivot_party].sort((a, b) => b.grand_total - a.grand_total).slice(0, 5);
    const maxOwner = ownersSorted.length ? ownersSorted[0].grand_total : 1;
    const maxParty = partiesSorted.length ? partiesSorted[0].grand_total : 1;
    const bar = (label, val, max) => '<div class="barrow"><span title="' + esc(label) + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(label) + '</span><div class="bwrap"><div class="bar" style="width:' + (max ? Math.max(2, (val / max) * 100) : 0) + '%"></div></div><span class="v">Rp ' + fmtR(val) + '</span></div>';
    $("presentation").innerHTML =
      '<h1>Ringkasan Sales Pipeline</h1>' +
      '<div class="sub">Dibuat ' + new Date(d.generated_at).toLocaleString("id-ID") + ' &middot; ' + d.row_count + ' baris data &middot; ' + d.pivot_owner.length + ' owner</div>' +
      '<div class="kpi">' + STAGING_CATS.map((c) => '<div><div class="n">Rp ' + fmtR(sum(c)) + '</div><div class="l">' + esc(c) + '</div></div>').join("") + '</div>' +
      '<div class="kpi" style="grid-template-columns:1fr"><div style="border-top-color:var(--won)"><div class="n">Rp ' + fmtR(totalAll) + '</div><div class="l">TOTAL SELURUH PIPELINE</div></div></div>' +
      '<h3>Peringkat Owner (berdasarkan Grand Total)</h3>' + ownersSorted.map((o) => bar(o.name, o.grand_total, maxOwner)).join("") +
      '<h3>Top 5 Sold To Party</h3>' + partiesSorted.map((p) => bar(p.name, p.grand_total, maxParty)).join("");
  }

  $("btnProcess").onclick = processAll;
  $("btnPivot").onclick = downloadPivot;
  $("btnPres").onclick = () => {
    if (!window.__pivotData) return;
    buildPresentation(window.__pivotData);
    $("root").hidden = true; $("presentation").hidden = false;
    $("btnPres").hidden = true; $("btnClosePres").hidden = false;
  };
  $("btnClosePres").onclick = () => {
    $("root").hidden = false; $("presentation").hidden = true;
    $("btnPres").hidden = false; $("btnClosePres").hidden = true;
  };
  $("btnDemo").onclick = () => {
    $("meta").textContent = "DEMO - 101 rows";
    const demo = { ...DEMO_DATA, rows: DEMO_DATA.rows.map((r) => ({ ...r, sold_to_party_group: normalizeParty(r.sold_to_party || "(Kosong)") })) };
    window.mountDashboard($("root"), demo);
    window.__pivotData = demo;
    $("btnPivot").disabled = false;
    $("btnPres").disabled = false;
    notice("warn", "Mode <b>DEMO</b> dengan data contoh ditampilkan.");
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".dash").forEach((el) => el.__clear && el.__clear()); });
  notice("warn", "Unggah 3 file Excel (Sales Pipeline, Closewon Contract, Closewon Non Contract). Nama Owner akan terdeteksi otomatis, lalu klik <b>Proses</b>. Atau klik <b>Lihat Demo</b>.");
})();
</script>
</body>
